<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Ultra-Bright Liquid Silver Chrome Base Gradient (NO BLACK) -->
    <linearGradient id="brightChromeBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#f1f5f9" />
      <stop offset="48%" stop-color="#cbd5e1" />
      <stop offset="72%" stop-color="#94a3b8" />
      <stop offset="88%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Warm Specular Reflection Gradient -->
    <linearGradient id="warmGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 235, 220, 0.7)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.2)" />
      <stop offset="100%" stop-color="rgba(215, 235, 255, 0.6)" />
    </linearGradient>

    <!-- Wave 1 Gradient (Bright Platinum Silver) -->
    <linearGradient id="brightWave1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#e2e8f0" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#94a3b8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="1" />
    </linearGradient>

    <!-- Wave 2 Gradient (Luminous Chrome) -->
    <linearGradient id="brightWave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#f1f5f9" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#cbd5e1" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.9" />
    </linearGradient>

    <!-- Metallic Lighting Filter -->
    <filter id="brightSpecularLighting" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.025" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feSpecularLighting in="displaced" surfaceScale="6" specularConstant="2.2" specularExponent="40" lighting-color="#ffffff" result="specular">
        <fePointLight x="400" y="-150" z="350" />
      </feSpecularLighting>
      <feComposite in="specular" in2="displaced" operator="in" result="specularCut" />
      <feBlend in="displaced" in2="specularCut" mode="screen" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="300" fill="url(#brightChromeBase)" />

  <!-- Flowing Liquid Chrome Metallic Waves (Bright Silver) -->
  <g filter="url(#brightSpecularLighting)">
    <path d="M -50,40 Q 180,200 380,70 T 780,160 T 900,30 L 900,350 L -50,350 Z" fill="url(#brightWave1)" opacity="0.9" />
    <path d="M -50,160 Q 220,-30 480,180 T 880,70 L 880,350 L -50,350 Z" fill="url(#brightWave2)" opacity="0.85" />
    <path d="M 0,80 C 260,260 420,-10 680,200 C 780,280 860,100 900,180 L 900,0 L 0,0 Z" fill="url(#warmGlow)" opacity="0.65" />
  </g>

  <!-- Starburst Lens Flare Glints (Bright Specular ✨) -->
  <g id="starburstGlints">
    <g transform="translate(190, 65)">
      <ellipse cx="0" cy="0" rx="40" ry="2.5" fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff)" />
      <ellipse cx="0" cy="0" rx="2.5" ry="40" fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff)" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>

    <g transform="translate(490, 185)">
      <ellipse cx="0" cy="0" rx="50" ry="3" fill="#ffffff" filter="drop-shadow(0 0 10px #ffffff)" />
      <ellipse cx="0" cy="0" rx="3" ry="50" fill="#ffffff" filter="drop-shadow(0 0 10px #ffffff)" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />
    </g>

    <g transform="translate(710, 75)">
      <ellipse cx="0" cy="0" rx="35" ry="2" fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff)" />
      <ellipse cx="0" cy="0" rx="2" ry="35" fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff)" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" />
    </g>
  </g>
</svg>