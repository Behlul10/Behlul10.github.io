<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Rich Visible 90s Anime Film Noise Filter -->
    <filter id="visibleAnimeNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="rawNoise" />
      <!-- Enhance contrast for visible 90s analog film grit -->
      <feColorMatrix type="matrix" values="
        1.5 0   0   0 -0.2
        0   1.5 0   0 -0.2
        0   0   1.5 0 -0.2
        0   0   0   0.45 0" in="rawNoise" result="contrastNoise" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="#7f7f7f" />
  <rect width="400" height="400" filter="url(#visibleAnimeNoise)" mix-blend-mode="overlay" opacity="0.85" />
</svg>