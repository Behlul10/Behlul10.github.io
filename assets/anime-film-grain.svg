<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Authentic 90s Anime Fine Film Grain Filter (NO DOTS, pure analog film noise) -->
    <filter id="animeFilmNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="matrix" values="
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0    0    0    0.15 0" in="noise" result="fineNoise" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="#808080" />
  <rect width="500" height="500" filter="url(#animeFilmNoise)" mix-blend-mode="overlay" />
</svg>